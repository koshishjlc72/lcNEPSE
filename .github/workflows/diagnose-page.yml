name: Diagnose ShareSansar HTML

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::curl, any::xml2

      - name: Fetch and inspect the page
        run: Rscript data-raw/diagnose-page.R

      - name: Upload captured HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sharesansar-html
          path: diagnose/
          retention-days: 5
